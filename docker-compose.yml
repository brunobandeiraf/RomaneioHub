services:
  postgres:
    image: postgres:16-alpine
    container_name: comprashub-postgres
    environment:
      POSTGRES_DB: comprashub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d comprashub']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3.8
    container_name: comprashub-localstack
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: comprashub-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/comprashub
      AWS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      S3_BUCKET: invoices-dev
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: development
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    restart: unless-stopped

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: comprashub-stripe-cli
    command: listen --forward-to http://api:3001/subscriptions/webhook
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: comprashub-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
